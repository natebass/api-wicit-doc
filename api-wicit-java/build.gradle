plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.opensac'
version = '0.0.1-SNAPSHOT'
description = 'The API for the WICit website.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('javadoc') {
    options.windowTitle = 'WICit API'
    options.docTitle = 'WICit API'
}

// Assembles the GitHub Pages site: the pages in docs/ with the Javadoc under api/.
tasks.register('docsSite', Sync) {
    group = 'documentation'
    description = 'Builds the documentation site into build/site.'
    from 'docs'
    from(tasks.named('javadoc')) {
        into 'api'
    }
    into layout.buildDirectory.dir('site')
}
